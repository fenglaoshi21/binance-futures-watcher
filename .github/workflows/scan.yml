name: 币安合约涨幅榜定时观测

on:
  schedule:
    # 每30分钟运行一次（UTC时间）
    - cron: "*/30 * * * *"
  # 支持手动触发
  workflow_dispatch:
  # 推送main分支时触发（用于测试）
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行观测 Pipeline
        env:
          # Coinglass/LSR API
          VIP2_API_KEY: ${{ secrets.VIP2_API_KEY }}
          VIP2_API_URL: https://vip2.coinglass.site
          # LLM
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL || 'qwen-turbo' }}
          QWEN_EMBEDDING_MODEL: text-embedding-v1
          # Supabase
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # 应用配置
          SCAN_INTERVAL_MINUTES: "30"
          COINGLASS_PER_PAGE: "100"
          RAG_TOP_K: "3"
          # GitHub Actions 运行在国外，不需要代理
          BINANCE_PROXY: ""
        run: |
          python src/pipeline.py

      - name: 上传运行结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-result
          path: data/pipeline_result_*.json
          retention-days: 7
